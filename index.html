<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Danh mục váy và phụ kiện cho thuê của Morina - Tiệm thuê đồ Hà Nội." />
    <title>Morina | Tiệm thuê đồ Hà Nội</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Morina - Tiệm thuê đồ Hà Nội">
          <span>
            <strong>Morina</strong>
            <small>Tiệm thuê đồ Hà Nội</small>
          </span>
        </a>
      </header>

      <section class="hero-section" aria-label="Morina trên TikTok và liên hệ đặt lịch">
        <section class="featured-carousel" aria-label="Carousel năm mẫu trang phục nổi bật">
          <div id="featured-carousel-track" class="featured-carousel-track" role="list" aria-label="Năm mẫu trang phục nổi bật"></div>
        </section>

        <div class="hero-contact-media">
          <a class="zalo-contact" href="https://zalo.me/0966923051" target="_blank" rel="noopener noreferrer">
            <span class="zalo-mark" aria-hidden="true"><img src="./zalo icon.svg" alt="" /></span>
            <span>
              <small>Đặt lịch qua Zalo</small>
              <strong>Liên hệ 0966.923.051 để tư vấn và đặt lịch</strong>
            </span>
            <span class="zalo-arrow" aria-hidden="true">↗</span>
          </a>
          <div class="tiktok-video">
            <p>Đường tới Morina</p>
            <iframe
              src="https://www.tiktok.com/player/v1/7685241849031707925?controls=1&description=0"
              title="TikTok Morina - Tiệm thuê đồ Hà Nội"
              loading="lazy"
              allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>

      <section class="catalog-panel" aria-label="Danh mục sản phẩm">
        <div class="tab-list" role="tablist" aria-label="Loại sản phẩm">
          <button id="dress-tab" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="dress-panel" data-tab="dress">Váy</button>
          <button id="accessory-tab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="accessory-panel" data-tab="accessories">Phụ kiện</button>
        </div>

        <div id="dress-panel" role="tabpanel" aria-labelledby="dress-tab">
          <label class="category-control" for="category-select">
            <span>Chọn danh mục để xem sản phẩm</span>
            <select id="category-select" aria-label="Chọn danh mục để xem sản phẩm"></select>
          </label>
        </div>
        <div id="accessory-panel" role="tabpanel" aria-labelledby="accessory-tab" hidden></div>

        <div class="catalog-status" aria-live="polite">
          <p id="catalog-count">Đang tải danh mục…</p>
          <p id="catalog-page-label" class="page-label"></p>
        </div>

        <div id="catalog-grid" class="catalog-grid" aria-live="polite"></div>
        <nav id="pagination" class="pagination" aria-label="Phân trang"></nav>
      </section>
    </main>

    <template id="empty-state-template">
      <div class="empty-state">
        <span aria-hidden="true">✦</span>
        <p>Hiện chưa có mẫu để hiển thị.</p>
      </div>
    </template>

    <dialog id="image-modal" class="image-modal" aria-labelledby="image-modal-title">
      <div class="image-modal-content">
        <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Đóng ảnh lớn">×</button>
        <img id="image-modal-image" alt="" referrerpolicy="no-referrer" />
        <p id="image-modal-title"></p>
      </div>
    </dialog>

    <script src="./app.js" defer></script>
  </body>
</html>
